<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Login | ResumeMatch AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-bg">
<div class="container"><div class="row justify-content-center"><div class="col-md-5">
    <div class="card card-modern p-4">
        <div class="text-center mb-3">
            <span class="badge bg-indigo bg-primary px-3 py-2 mb-2">NLP & Career AI</span>
            <h3 class="fw-bold">ResumeMatch AI</h3>
            <p class="text-muted small">AI-Powered Resume Analyzer & Career Recommendation</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>{% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3"><label class="form-label fw-semibold">Email</label><input type="email" name="email" class="form-control" placeholder="admin@resumematch.ai" required></div>
            <div class="mb-3"><label class="form-label fw-semibold">Password</label><input type="password" name="password" class="form-control" placeholder="admin123" required></div>
            <button class="btn btn-primary w-100 fw-semibold">Login to Portal</button>
        </form>
        <div class="alert alert-light border mt-3 mb-2 py-2 small text-center"><strong>Demo:</strong> admin@resumematch.ai | <strong>Pass:</strong> admin123</div>
        <div class="text-center small">New Student? <a href="{{ url_for('register') }}">Register Here</a></div>
    </div>
</div></div></div>
</body>
</html>
