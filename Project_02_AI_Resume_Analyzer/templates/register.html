<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Register | ResumeMatch AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-bg">
<div class="container"><div class="row justify-content-center"><div class="col-md-5">
    <div class="card card-modern p-4">
        <h3 class="fw-bold text-center mb-3">Candidate Registration</h3>
        <form method="POST">
            <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="full_name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Role</label><select name="role" class="form-select"><option value="Candidate">Candidate</option><option value="Admin">Admin</option></select></div>
            <button class="btn btn-success w-100 fw-semibold">Create Account</button>
        </form>
        <div class="text-center small mt-3"><a href="{{ url_for('login') }}">Back to Login</a></div>
    </div>
</div></div></div>
</body>
</html>
